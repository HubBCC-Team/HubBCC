<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Alterar sessão — HubBCC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <span class="sistema">HubBCC — Sistema de Monitoria</span>
  <span class="perfil">Perfil: Monitor</span>
</header>
<nav class="breadcrumb"><a href="index.html">← Índice</a> · Prioridade 10 · vindo de <a href="05-consultar-sessao.html">Consultar sessão</a></nav>

<main>
  <h1>Alterar sessão</h1>
  <p class="caso-de-uso"> · Ator: Monitor · edita data, horário e vagas de uma sessão já criada.</p>

  <div class="painel">
    <label for="disciplina">Disciplina</label>
    <input id="disciplina" value="Estruturas de Dados" disabled>

    <div class="linha">
      <div>
        <label for="data">Data</label>
        <input type="date" id="data" value="2026-09-10">
      </div>
      <div>
        <label for="horario">Horário</label>
        <input type="time" id="horario" value="19:00">
      </div>
    </div>

    <label for="vagas">Quantidade de vagas</label>
    <input type="number" id="vagas" value="5" min="1">

    <div class="acoes">
      <button class="botao-primario" type="button" onclick="window.location='05-consultar-sessao.html'">Salvar alterações</button>
      <a class="botao botao-secundario" href="05-consultar-sessao.html">Cancelar</a>
    </div>
  </div>
</main>
<footer class="rodape">Protótipo — dados fictícios.</footer>
</body>
</html>
