<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Criar sessão — HubBCC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <span class="sistema">HubBCC — Sistema de Monitoria</span>
  <span class="perfil">Perfil: Monitor</span>
</header>
<nav class="breadcrumb"><a href="index.html">← Índice</a> · Prioridade 4</nav>

<main>
  <h1>Criar sessão</h1>
  <p class="caso-de-uso"> · Ator: Monitor · cadastra uma nova sessão de monitoria disponível para agendamento.</p>

  <div class="painel">
    <label for="disciplina">Disciplina</label>
    <select id="disciplina">
      <option>Estruturas de Dados</option>
      <option>Engenharia de Software</option>
      <option>Programação I</option>
    </select>

    <div class="linha">
      <div>
        <label for="data">Data</label>
        <input type="date" id="data">
      </div>
      <div>
        <label for="horario">Horário</label>
        <input type="time" id="horario" value="19:00">
      </div>
    </div>

    <div class="linha">
      <div>
        <label for="vagas">Quantidade de vagas</label>
        <input type="number" id="vagas" value="5" min="1">
      </div>
      <div>
        <label for="modalidade">Modalidade</label>
        <select id="modalidade">
          <option>Remota</option>
          <option>Presencial</option>
        </select>
      </div>
    </div>

    <label for="descricao">Descrição / tópicos abordados</label>
    <textarea id="descricao" placeholder="Ex.: revisão de listas encadeadas e árvores binárias"></textarea>

    <div class="acoes">
      <button class="botao-primario" type="button" onclick="window.location='05-consultar-sessao.html'">Publicar sessão</button>
      <a class="botao botao-secundario" href="05-consultar-sessao.html">Cancelar</a>
    </div>
  </div>
</main>
<footer class="rodape">Protótipo — dados fictícios.</footer>
</body>
</html>
