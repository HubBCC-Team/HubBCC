<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Alterar oportunidade acadêmica — HubBCC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <span class="sistema">HubBCC — Oportunidades Acadêmicas</span>
  <span class="perfil">Perfil: Professor</span>
</header>
<nav class="breadcrumb"><a href="index.html">← Índice</a> · vindo de <a href="oa-02-consultar-oportunidades.html">Consultar oportunidades</a></nav>

<main>
  <h1>Alterar oportunidade acadêmica</h1>
  <p class="caso-de-uso"> · Ator: Professor · atualiza dados de uma oportunidade já publicada.</p>

  <div class="painel">
    <label for="titulo">Título</label>
    <input id="titulo" value="Iniciação Científica em Sistemas Distribuídos">

    <div class="linha">
      <div>
        <label for="vagas">Vagas</label>
        <input type="number" id="vagas" value="2">
      </div>
      <div>
        <label for="prazo">Prazo para candidatura</label>
        <input type="date" id="prazo" value="2026-09-30">
      </div>
    </div>

    <label for="requisitos">Requisitos</label>
    <textarea id="requisitos">Ter cursado Estruturas de Dados, disponibilidade de 8h semanais.</textarea>

    <div class="acoes">
      <button class="botao-primario" type="button" onclick="window.location='oa-02-consultar-oportunidades.html'">Salvar alterações</button>
      <a class="botao botao-secundario" href="oa-02-consultar-oportunidades.html">Cancelar</a>
    </div>
  </div>
</main>
<footer class="rodape">Protótipo — dados fictícios.</footer>
</body>
</html>
